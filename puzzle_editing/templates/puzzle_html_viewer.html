{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="shortcut icon" href="{% static 'favicon.ico' %}"/>
  <title>{{ puzzle.name }} · PuzzUp</title>
  <style>
    :root { --bar-bg: #f5f5f5; --bar-ink: #363636; --bar-line: #dbdbdb; --link: #3273dc; --page: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bar-bg: #1f2226; --bar-ink: #ecebe6; --bar-line: #33373d; --link: #7aa7ff; --page: #15171a; }
    }
    html, body { margin: 0; height: 100%; background: var(--page); }
    body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 16px;
           background: var(--bar-bg); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line); }
    .bar a { color: var(--link); text-decoration: none; font-weight: 600; }
    .bar a:hover { text-decoration: underline; }
    .bar .title { font-weight: 700; }
    .bar .note { margin-left: auto; opacity: .7; font-size: 12px; }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="{{ back_url }}">&larr; {{ back_label }}</a>
    <span class="title">{{ puzzle.name }}</span>
    <span class="note">Submit answers in PuzzUp, not inside the puzzle.</span>
  </div>
  {# srcdoc is HTML-escaped by Django autoescape, so the page can't break out of the attribute. #}
  <iframe title="{{ puzzle.name }}" sandbox="{{ sandbox }}" referrerpolicy="no-referrer" srcdoc="{{ puzzle.content_html }}"></iframe>
</body>
</html>
