{% extends "base.html" %}

{% block main %}
{% if output %}
<p class="notification">
{{ output }}
</p>
{% else %}
<p>Export the metadata of every puzzle that has an answer, either for one act or all of them. This creates a new <code>export-…</code> branch in the hunt repo.</p>
{% endif %}
<form method="post" action="">
  {% csrf_token %}
  <p>
  <select name="act">
    <option value="">All acts</option>
    {% for act in acts %}
    <option value="{{ act.name }}">{{ act.name }}</option>
    {% endfor %}
  </select>
  <br/>
  <br/>
  <input class="button is-info" type="submit" name="export" value="Export all">
  </p>
</form>

<br>

{% endblock %}
